nombre:  Pruebas  automáticas  del  grupo en:
   push:
     ramas:
       -  principal
       -  "*" trabajos:
   test:
     se ejecuta en:  ubuntu-latest
     entorno:
       PYTHONPATH:  ${{  github.workspace  }}

     pasos:
       -  nombre:  Clonar  el  repositorio
         usa:  actions/checkout@v3

       -  nombre:  Configurar  Python
         usa:  actions/setup-python@v4
         con:
           python-version:  "3.10"

       -  nombre:  Instalar  dependencias
         ejecutar:  |
           python  -m  pip  install  --upgrade  pip
           pip  install  pytest

       -  nombre:  Mostrar  estructura  (depuración)
         ejecutar:  |
           pwd
           ls  -R

       -  nombre:  Ejecutar  pruebas
         ejecutar:  |
           python  -m  pytest  -v 